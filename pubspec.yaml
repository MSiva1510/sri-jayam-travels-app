name: sri_jayam_travels
description: Sri Jayam Travels Driver App
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase: ^1.0.0
  flutter_riverpod: ^2.0.0
  flutter_svg: ^2.0.0
  shared_preferences: ^2.0.0
  intl: ^0.18.0
  url_launcher: ^6.0.0
  permission_handler: ^10.0.0
  geolocator: ^10.0.0
  flutter_polyline_points: ^1.0.0
  google_maps_flutter: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/