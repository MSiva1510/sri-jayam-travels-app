# ── Sri Jayam Travels — Netlify Configuration ──────────────────

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node >= 20.19; pin the LTS line (must match .nvmrc / engines)
  NODE_VERSION = "22"
  NPM_FLAGS    = "--no-audit --no-fund"

[functions]
  # Bundle netlify/functions/*.js with esbuild so the shared _lib/ import
  # in gps-proxy.js is resolved at deploy time.
  node_bundler = "esbuild"

# ── Redirects ──────────────────────────────────────────────────
[[redirects]]
  from   = "/api/gps-proxy"
  to     = "/.netlify/functions/gps-proxy"
  status = 200

# SPA fallback: every path serves index.html so React Router handles routing.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ───────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "DENY"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    # Driver GPS capture needs geolocation; everything else is off.
    Permissions-Policy        = "geolocation=(self), camera=(), microphone=(), payment=(), usb=()"
    # No inline scripts exist in the build; styles need unsafe-inline (Tailwind
    # style attributes + the invoice print window). Origins below are the only
    # third parties the app talks to.
    Content-Security-Policy   = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://travelsjayam.in https://*.supabase.co https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://mvt.apmkingstrack.com https://app.gpstrack.in https://nominatim.openstreetmap.org; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

# Hashed Vite assets never change — cache for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must always be revalidated so new deploys are picked up.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# The GPS proxy relays vendor data — never cache it.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
